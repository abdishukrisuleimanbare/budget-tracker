<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Budget Tracker</h1>
    <p class="subheading">Track your income and expenses in one place.</p>
  </header>

  <section id="add-expense" class="card">
    <h2>Add Expense</h2>
    <div class="form-group">
      <label for="expense-name">Expense Name</label>
      <input type="text" id="expense-name" placeholder="e.g. Groceries">
    </div>
    <div class="form-group">
      <label for="expense-amount">Amount</label>
      <input type="number" id="expense-amount" placeholder="0.00">
    </div>
    <div class="form-group">
      <label for="expense-category">Category</label>
      <input type="text" id="expense-category" placeholder="e.g. Food">
    </div>
    <button type="button" class="add-btn">Add Expense</button>
  </section>

  <section id="expense-list" class="card">
    <h2>Your Expenses</h2>
    <p class="placeholder-text">No expenses yet</p>
  </section>

  <footer>
    <p>&copy; 2026 My Budget Tracker</p>
  </footer>

</body>
</html>
